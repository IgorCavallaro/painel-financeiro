<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Painel 50/30/20">
<title>Painel 50/30/20</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface2:#F8FAFC; --line:#E2E8F0; --track:#E8EDF3;
  --text:#0F172A; --muted:#64748B; --faint:#94A3B8;
  --brand:#2563EB; --brand-strong:#1D4ED8; --brand-soft:#EFF6FF;
  --nec:#2563EB; --des:#F59E0B; --inv:#10B981;
  --bad:#E11D48; --bad-soft:#FFF1F2; --ok:#059669; --ok-soft:#ECFDF5; --warn:#B45309; --warn-soft:#FFFBEB;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px -4px rgba(15,23,42,.06);
  --float:0 10px 24px -6px rgba(37,99,235,.45);
  --radius:20px; --display:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#060B16; --surface:#0F172A; --surface2:#131C31; --line:#1E293B; --track:#1E293B;
  --text:#E2E8F0; --muted:#94A3B8; --faint:#64748B;
  --brand:#3B82F6; --brand-strong:#60A5FA; --brand-soft:#132042;
  --nec:#3B82F6; --des:#FBBF24; --inv:#34D399;
  --bad:#FB7185; --bad-soft:#2A1220; --ok:#34D399; --ok-soft:#0D2A22; --warn:#FBBF24; --warn-soft:#2A2110;
  --shadow:0 1px 2px rgba(0,0,0,.3); --float:0 10px 24px -6px rgba(59,130,246,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#060B16; --surface:#0F172A; --surface2:#131C31; --line:#1E293B; --track:#1E293B;
    --text:#E2E8F0; --muted:#94A3B8; --faint:#64748B;
    --brand:#3B82F6; --brand-strong:#60A5FA; --brand-soft:#132042;
    --nec:#3B82F6; --des:#FBBF24; --inv:#34D399;
    --bad:#FB7185; --bad-soft:#2A1220; --ok:#34D399; --ok-soft:#0D2A22; --warn:#FBBF24; --warn-soft:#2A2110;
    --shadow:0 1px 2px rgba(0,0,0,.3); --float:0 10px 24px -6px rgba(59,130,246,.5);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.h{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
.app{position:fixed;inset:0;display:flex;background:var(--bg)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px calc(110px + env(safe-area-inset-bottom))}
.wrap{max-width:1040px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:var(--bg)}
.hello{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.hello small{display:block;font-size:11px;color:var(--muted)}
.hello b{font-family:var(--display);font-size:16px;white-space:nowrap}
.cycle{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px}
.cycle button{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.cycle button:hover{background:var(--surface2);color:var(--text)}
.cycle .lbl{padding:0 4px;text-align:center;line-height:1.1;min-width:84px;cursor:pointer}
.cycle .lbl b{font-size:12px;display:block;text-transform:capitalize}
.cycle .lbl span{font-size:10px;color:var(--muted)}
.side{display:none;width:248px;background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;flex-direction:column;gap:6px;flex-shrink:0}
.side .logo{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.logo-mark{width:36px;height:36px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px}
.side .logo b{font-family:var(--display);font-size:15px;display:block}
.side .logo small{font-size:11px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.on{background:var(--brand-soft);color:var(--brand)}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.side .foot b{font-size:12px;display:block}.side .foot small{font-size:11px;color:var(--muted)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:10px;font-weight:600;color:var(--faint)}
.bottom button .dot{padding:4px 14px;border-radius:99px}
.bottom button.on{color:var(--brand)}.bottom button.on .dot{background:var(--brand-soft)}
.bottom .fab{width:52px;height:52px;margin-top:-26px;border-radius:18px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:var(--float);border:4px solid var(--bg)}
.bottom .fab svg{width:24px;height:24px}
.ai-fab{position:fixed;z-index:25;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#7C3AED,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;box-shadow:0 10px 24px -6px rgba(124,58,237,.5)}
.ai-fab svg{width:22px;height:22px}.ai-fab .lbl{display:none}
.app.chat-open .ai-fab,.app.sel-mode .ai-fab{display:none}
@media (min-width:900px){
  .side{display:flex}.bottom{display:none}
  .scroll{padding:8px 32px 48px}.top{padding:20px 32px 8px}
  .top .hello{visibility:hidden}
  .ai-fab{bottom:28px;right:28px;width:auto;padding:0 18px 0 14px;height:48px;border-radius:16px}.ai-fab .lbl{display:inline}
  .grid2{grid-template-columns:1fr 1fr}
  .alerts{margin:0!important;padding:0!important;display:grid!important;grid-template-columns:repeat(3,1fr);overflow:visible!important}
  .limits{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .page-t h1{font-size:28px!important}
  .card{padding:20px}
}
@media (max-width:899px){.lim .row{flex-direction:column;align-items:flex-start;gap:8px}}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-family:var(--display);font-size:15px;font-weight:700}
.card-h p{font-size:12px;color:var(--muted);margin-top:2px}
.link{font-size:12px;font-weight:600;color:var(--brand);display:flex;align-items:center;gap:2px;white-space:nowrap}
.page-t{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 14px}
.page-t h1{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.page-t p{font-size:12px;color:var(--muted);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-brand{background:var(--brand-soft);color:var(--brand)}.b-mute{background:var(--surface2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;font-size:13px;font-weight:600;padding:9px 14px;transition:transform .1s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--float)}.btn-primary:hover{background:var(--brand-strong)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn-soft{background:var(--surface2);border:1px solid var(--line)}.btn-soft:hover{border-color:var(--faint)}
.btn-ok{background:var(--ok-soft);color:var(--ok)}.btn-danger{background:var(--bad);color:#fff}
.btn-block{width:100%;padding:13px;border-radius:16px;font-size:14px}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:10px}
.icon-btn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--faint);flex-shrink:0}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn.danger:hover{background:var(--bad-soft);color:var(--bad)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill-btn{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.pill-btn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.money{font-family:var(--display);font-weight:800;letter-spacing:-.02em}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.bar{height:8px;border-radius:99px;background:var(--track);position:relative;overflow:hidden}
.bar>span{position:absolute;top:0;bottom:0;border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:13px;line-height:1.5}
.empty .ico{width:48px;height:48px;border-radius:16px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 10px}
.fade{animation:fade .28s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(160deg,#1E3A8A 0%,#2563EB 55%,#3B82F6 100%);color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:12px;opacity:.8;font-weight:500}
.hero .big{font-size:34px;line-height:1.1;margin:4px 0 2px}
.hero .sub{font-size:12px;opacity:.85}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero-stats div{background:rgba(255,255,255,.12);border-radius:14px;padding:9px 10px}
.hero-stats small{font-size:10px;opacity:.8;display:block}
.hero-stats b{font-family:var(--display);font-size:14px}
.daybar{margin-top:14px}
.daybar .t{display:flex;justify-content:space-between;font-size:11px;opacity:.85;margin-bottom:5px}
.daybar .bar{background:rgba(255,255,255,.2);height:6px}.daybar .bar span{background:#fff}
.alerts{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.alerts::-webkit-scrollbar{display:none}
.alert{scroll-snap-align:start;min-width:250px;flex:1;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);text-align:left}
.alert .ai{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.alert b{font-size:13px;display:block}.alert p{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.alert .go{font-size:12px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:2px}
.bucket{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.bucket:first-of-type{border-top:0;padding-top:4px}
.bucket .info{flex:1;min-width:0}.bucket .info .between b{font-size:13px}
.bucket .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.stackbar{height:10px;border-radius:99px;background:var(--track);position:relative;overflow:hidden;margin-top:6px}
.stackbar span{position:absolute;top:0;bottom:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.limits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lim{min-width:0;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.lim .row{min-width:0}
.lim .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;font-size:13px;font-weight:800;font-family:var(--display)}
.tx .tm{flex:1;min-width:0;cursor:pointer}
.tx .tm b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .tm small{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .tv{text-align:right;font-family:var(--display);font-weight:700;font-size:13px;white-space:nowrap}
.tx .tv small{display:block;font-family:'Inter';font-weight:500;font-size:10px;color:var(--faint)}
.tx .tv.in{color:var(--ok)}
.fx{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.fx.pend{border-color:color-mix(in srgb,var(--des) 45%,var(--line));background:color-mix(in srgb,var(--warn-soft) 55%,var(--surface))}
.fx .fm{flex:1;min-width:0}
.fx .fm b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx .fm small{font-size:11px;color:var(--muted)}
.fx .fv{font-family:var(--display);font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.fx.selectable{cursor:pointer}.fx.picked{border-color:var(--brand);background:var(--brand-soft)}
.cbox{width:24px;height:24px;border-radius:8px;border:2px solid var(--faint);display:grid;place-items:center;flex-shrink:0;color:#fff}
.fx.picked .cbox{background:var(--brand);border-color:var(--brand)}
.grp-t{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:14px 2px 8px;display:flex;justify-content:space-between}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bulkbar{position:sticky;bottom:12px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--text);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 12px 30px -8px rgba(0,0,0,.35);animation:fade .2s}
.bulkbar b{display:block;font-size:13px}.bulkbar span{font-size:12px;opacity:.75}
.bulk-list{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}
.rk{padding:8px 0}.rk .between{font-size:12px;margin-bottom:5px}.rk .between b{font-family:var(--display)}
.cmp{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12px}
.cmp:first-child{border-top:0}
.fat{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--surface);box-shadow:var(--shadow)}
.queue{display:flex;align-items:center;gap:8px;font-size:12px;padding:10px 12px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.list-row:first-child{border-top:0}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;animation:ov .2s}
@keyframes ov{from{opacity:0}}
@media (min-width:900px){.overlay{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.22,1,.36,1)}
@media (min-width:900px){.sheet{border-radius:28px;max-height:88%}.sheet .grab{display:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 0;flex-shrink:0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px 10px}
.sheet-h h3{font-family:var(--display);font-size:18px;font-weight:800}
.sheet-h p{font-size:12px;color:var(--muted)}
.xbtn{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.sheet-b{padding:4px 20px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:15px;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 15%,transparent)}
.input:disabled{opacity:.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount{border:1px solid var(--line);background:var(--surface2);border-radius:20px;padding:14px;text-align:center}
.amount:focus-within{border-color:var(--brand)}
.amount .r{display:flex;align-items:center;justify-content:center;gap:4px}
.amount .r span{font-family:var(--display);font-weight:700;font-size:22px;color:var(--faint)}
.amount input{width:210px;max-width:70%;border:0;background:none;outline:none;text-align:center;font-family:var(--display);font-weight:800;font-size:36px}
.amount input::placeholder{color:var(--faint);opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;position:relative;cursor:pointer}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.dest{font-size:12px;padding:10px 12px;border-radius:12px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;gap:8px;line-height:1.4}
.dest b{color:var(--text)}
.sel-wrap{position:relative}

<script>
/* ============================================================
   Painel 50/30/20 — app v2
   Dados no Supabase (config.js). Cada usuário só vê os próprios dados (RLS).
   Regras:
   - Mês pessoal: profiles.dia_inicio_mes (ex.: 25 = do dia 25 ao dia 24).
   - Despesa fixa só vira gasto quando recebe baixa (lançamento ligado a ela).
   - Cartão (se profiles.cartao_dia_fechamento/vencimento preenchidos): compra no
     cartão conta como PREVISTA no mês em que a fatura vence e como PAGA quando
     a fatura recebe baixa (tabela faturas). Sem datas: conta pela data da compra.
   - Investimento = aportes em reservas.
   ============================================================ */
const cfg = window.APP_CONFIG || {};
const sb = (window.supabase && cfg.SUPABASE_URL) ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
const ASSISTENTE_IDS = ['fdcfddb0-5ab1-4ba5-9dc3-b77b3b8137ec'];
const FORMAS = ['Cartão de crédito','Pix','Débito','Dinheiro'];
const GRUPOS = ['Necessário','Desejado','Investimento'];
const PCT = {'Necessário':50,'Desejado':30,'Investimento':20};
const COR = {'Necessário':'var(--nec)','Desejado':'var(--des)','Investimento':'var(--inv)','Sem grupo':'var(--faint)'};
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

let USER = null;
const P = {nome:'', dia:1, fecha:null, vence:null};
const D = {cats:[], tx:[], fixas:[], rendas:[], reservas:[], aportes:[], patItens:[], patSnaps:[], faturas:[]};
const S = {tab:'inicio', mes:null, theme:'auto', rankF:'Necessário', fxF:'pendentes', resTab:'metas', selMode:false, sel:[],
  chatOpen:false, chat:[], busy:false, lastPay:'Cartão de crédito', hist:{q:'',tipo:'',cat:'',forma:'',mes:null}};
try{ S.theme = localStorage.getItem('tema') || 'auto'; S.lastPay = localStorage.getItem('ultimaForma') || S.lastPay; }catch(e){}
applyTheme();

/* ============ HELPERS ============ */
const pad = n => String(n).padStart(2,'0');
const isoD = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = () => localISO(new Date());
const ontem = () => { const d=new Date(); d.setDate(d.getDate()-1); return localISO(d); };
const num = v => { const n = typeof v==='number' ? v : parseFloat(String(v??'').replace(',','.')); return isFinite(n) ? n : 0; };
const brl = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0 = v => 'R$ ' + Math.round(v||0).toLocaleString('pt-BR');
const k = v => Math.abs(v)>=1000 ? 'R$ '+(v/1000).toFixed(1).replace('.',',')+'k' : 'R$ '+Math.round(v||0);
const pct = (a,b) => b>0 ? Math.round(a/b*100) : 0;
const fmtD = d => d ? d.slice(8,10)+'/'+d.slice(5,7) : '';
const fmtDY = d => d ? d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4) : '';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseV = s => parseFloat(String(s||'').replace(/\./g,'').replace(',','.')) || 0;
const fmtV = v => v ? Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '';
function maskV(el){ const d=el.value.replace(/\D/g,''); el.value = d ? (parseInt(d,10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2}) : ''; }
const grupoDe = cat => (D.cats.find(c=>c.nome===cat)||{}).grupo || 'Sem grupo';
const catsAtivas = () => D.cats.filter(c=>c.ativo!=='Não');
const normTx = t => ({...t, valor:num(t.valor), data:String(t.data).slice(0,10)});

/* ---- mês pessoal ---- */
function mesFiscal(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); if(P.dia>1 && d>=P.dia){ const n=new Date(Date.UTC(y,m,1)); return `${n.getUTCFullYear()}-${pad(n.getUTCMonth()+1)}`; } return `${y}-${pad(m)}`; }
function periodo(mes){ const [y,m]=mes.split('-').map(Number); if(P.dia<=1) return {de:`${mes}-01`, ate:isoD(new Date(Date.UTC(y,m,0)))}; return {de:isoD(new Date(Date.UTC(y,m-2,P.dia))), ate:isoD(new Date(Date.UTC(y,m-1,P.dia-1)))}; }
function addMes(mes,n){ const [y,m]=mes.split('-').map(Number); const d=new Date(Date.UTC(y,m-1+n,1)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}`; }
const nomeMes = mes => MESES[Number(mes.slice(5,7))-1] + (mes.slice(0,4)!==String(new Date().getFullYear()) ? ' '+mes.slice(0,4) : '');
const mesAtual = () => mesFiscal(hoje());

/* ---- cartão ---- */
const temCartao = () => !!(P.fecha && P.vence);
function faturaVenc(iso){
  if(!temCartao()) return null;
  const [y,m,d] = iso.split('-').map(Number);
  const fechaOff = d <= P.fecha ? 0 : 1;
  const vencOff = P.vence > P.fecha ? fechaOff : fechaOff + 1;
  return isoD(new Date(Date.UTC(y, m-1+vencOff, P.vence)));
}
const ehCartaoVar = t => !!t && t.tipo==='Despesa' && t.forma_pagamento==='Cartão de crédito' && !t.despesa_fixa_id && temCartao();
const mesOrc = t => ehCartaoVar(t) ? mesFiscal(faturaVenc(t.data)) : mesFiscal(t.data);
const faturaReg = v => D.faturas.find(f=>f.vencimento===v);
const txPago = t => !ehCartaoVar(t) || !!faturaReg(faturaVenc(t.data));
function vencDoMes(mes){ if(!temCartao()) return null; const {de,ate}=periodo(mes); for(const base of [ate,de]){ const v=`${base.slice(0,7)}-${pad(P.vence)}`; if(v>=de && v<=ate) return v; } return null; }

/* ---- fixas e renda ---- */
function fixaVigente(f,mes){ if(f.ativo!=='Sim') return false; if(f.data_inicio && mes<mesFiscal(f.data_inicio)) return false; if(f.data_fim && mes>mesFiscal(f.data_fim)) return false; return true; }
const baixaDe = (f,mes) => D.tx.find(t=>t.despesa_fixa_id===f.id && mesFiscal(t.data)===mes);
const rendaFixaVigente = (r,mes) => r.ativo==='Sim' && !(r.data_inicio && mes<mesFiscal(r.data_inicio)) && !(r.data_fim && mes>mesFiscal(r.data_fim));

/* ---- cálculo do mês ---- */
function calc(mes){
  const {de,ate} = periodo(mes);
  const desp = D.tx.filter(t=>t.tipo==='Despesa' && mesOrc(t)===mes);
  const receitas = D.tx.filter(t=>t.tipo==='Receita' && mesFiscal(t.data)===mes);
  const rendasF = D.rendas.filter(r=>rendaFixaVigente(r,mes));
  const renda = receitas.reduce((a,t)=>a+t.valor,0) + rendasF.reduce((a,r)=>a+r.valor,0);
  const aportes = D.aportes.filter(a=>mesFiscal(a.data)===mes);
  const aporteTot = aportes.reduce((a,x)=>a+x.valor,0);
  const vig = D.fixas.filter(f=>fixaVigente(f,mes));
  const pend = vig.filter(f=>!baixaDe(f,mes));
  const g = {}; GRUPOS.concat('Sem grupo').forEach(b=>g[b]={pago:0,cartao:0,pend:0});
  const porCat = {}, porForma = {};
  let pago=0, cartaoAberto=0, fixo=0, vari=0;
  for(const t of desp){
    const b = grupoDe(t.categoria);
    if(txPago(t)){ g[b].pago += t.valor; pago += t.valor; } else { g[b].cartao += t.valor; cartaoAberto += t.valor; }
    porCat[t.categoria] = (porCat[t.categoria]||0) + t.valor;
    const f = t.forma_pagamento || 'Não informado'; porForma[f] = (porForma[f]||0) + t.valor;
    if(t.despesa_fixa_id) fixo += t.valor; else vari += t.valor;
  }
  g['Investimento'].pago += aporteTot;
  pend.forEach(f=>{ g[grupoDe(f.categoria)].pend += f.valor; });
  const pendTot = pend.reduce((a,f)=>a+f.valor,0);
  const gasto = pago + cartaoAberto;
  const saldo = renda - pago - aporteTot;
  const proj = saldo - cartaoAberto - pendTot;
  const orc = {}; GRUPOS.forEach(b=>orc[b]=renda*PCT[b]/100);
  return {mes,de,ate,desp,receitas,renda,rendasF,aportes,aporteTot,vig,pend,pendTot,g,porCat,porForma,pago,cartaoAberto,gasto,saldo,proj,orc,fixo,vari,venc:vencDoMes(mes)};
}
function diaDoCiclo(mes){ const {de,ate}=periodo(mes), h=hoje(); const tot=Math.round((Date.parse(ate)-Date.parse(de))/864e5)+1; if(h<de) return {dia:0,tot}; if(h>ate) return {dia:tot,tot}; return {dia:Math.round((Date.parse(h)-Date.parse(de))/864e5)+1,tot}; }

/* ============ ICONES E GRÁFICOS (SVG puro) ============ */
const IC={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 pie:'<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.3A9 9 0 0 1 20.7 9H15z"/>',
 check:'<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/>',
 tick:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
 piggy:'<path d="M5 11a7 6 0 0 1 7-5h2a6 6 0 0 1 5 2.5l2 .5v4l-2 1-1 3h-3v-2h-4v2H8l-1-2.5A5 5 0 0 1 5 11z"/><path d="M5 11H3"/><circle cx="16" cy="10" r=".6" fill="currentColor"/>',
 sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 spark:'<path d="M12 3.5l1.7 4.8 4.8 1.7-4.8 1.7L12 16.5l-1.7-4.8L5.5 10l4.8-1.7z"/><path d="M18.5 15l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>', left:'<path d="m15 6-6 6 6 6"/>', right:'<path d="m9 6 6 6-6 6"/>',
 send:'<path d="M5 12h13M13 6l6 6-6 6"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
 alert:'<path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17.2v.1"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 card:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 trend:'<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
 logout:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l5-5-5-5M15 12H4"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 down:'<path d="M12 4v12M6 11l6 6 6-6M5 20h14"/>',
 wifi:'<path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01"/>',
 refresh:'<path d="M20 11A8 8 0 0 0 6 6.3L4 8M4 4v4h4M4 13a8 8 0 0 0 14 4.7l2-1.7M20 20v-4h-4"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
 auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>'
};
const ic = (n,s) => `<svg class="i" viewBox="0 0 24 24" ${s?`style="width:${s}px;height:${s}px"`:''}>${IC[n]||''}</svg>`;
function ring(p,color,size=56,sw=6,label){
  const r=(size-sw)/2,c=2*Math.PI*r,cl=Math.max(0,Math.min(100,p));
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c-cl/100*c}" style="transition:stroke-dashoffset .7s cubic-bezier(.22,1,.36,1)"/></svg><span style="position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:${size<60?11:13}px">${label??p+'%'}</span></div>`;
}
function donut(segs,size=130,sw=16,center=''){
  const tot=segs.reduce((a,s)=>a+s.v,0)||1; let off=0;
  const arcs=segs.filter(s=>s.v>0).map(s=>{const L=s.v/tot*100,L2=Math.max(L-.8,0);const a=`<circle cx="50" cy="50" r="40" fill="none" stroke="${s.c}" stroke-width="${sw*100/size}" pathLength="100" stroke-dasharray="${L2} ${100-L2}" stroke-dashoffset="${-off}"><title>${esc(s.l)}: ${brl(s.v)}</title></circle>`;off+=L;return a}).join('');
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0"><svg viewBox="0 0 100 100" width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--track)" stroke-width="${sw*100/size}"/>${arcs}</svg><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">${center}</div></div>`;
}
function paceChart(c){
  const W=320,H=130,Pd=6,{dia,tot}=diaDoCiclo(c.mes),teto=c.renda*.8||1, top=Math.max(c.renda, c.gasto+c.pendTot, 1);
  const x=i=>Pd+i/Math.max(tot-1,1)*(W-2*Pd), y=v=>H-Pd-v/top*(H-2*Pd-12);
  const porDia=new Array(tot).fill(0);
  c.desp.forEach(t=>{ let i=Math.round((Date.parse(t.data)-Date.parse(c.de))/864e5); i=Math.max(0,Math.min(tot-1,i)); porDia[i]+=t.valor; });
  let acc=0; const pts=[]; const ate=Math.max(dia,1);
  for(let i=0;i<ate;i++){ acc+=porDia[i]; pts.push([i,acc]); }
  const last=pts[pts.length-1], proj=last[1]+c.pendTot;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
   <line x1="${Pd}" y1="${y(teto)}" x2="${W-Pd}" y2="${y(teto)}" stroke="var(--bad)" stroke-dasharray="3 4" stroke-width="1" opacity=".6"/>
   <text x="${W-Pd}" y="${y(teto)-4}" text-anchor="end" font-size="9" fill="var(--bad)">teto de gastos 80% · ${k(teto)}</text>
   <line x1="${x(0)}" y1="${y(0)}" x2="${x(tot-1)}" y2="${y(teto)}" stroke="var(--faint)" stroke-dasharray="4 4" stroke-width="1.5"/>
   <path d="M${x(0)} ${y(0)} L${pts.map(p=>x(p[0])+' '+y(p[1])).join(' L')} L${x(last[0])} ${y(0)} Z" fill="var(--brand)" opacity=".12"/>
   <polyline points="${x(0)},${y(0)} ${pts.map(p=>x(p[0])+','+y(p[1])).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
   ${c.pendTot&&dia<tot?`<line x1="${x(last[0])}" y1="${y(last[1])}" x2="${x(tot-1)}" y2="${y(proj)}" stroke="var(--des)" stroke-width="2" stroke-dasharray="2 4"/><circle cx="${x(tot-1)}" cy="${y(proj)}" r="3.5" fill="var(--des)"/>`:''}
   <circle cx="${x(last[0])}" cy="${y(last[1])}" r="4.5" fill="var(--brand)" stroke="var(--surface)" stroke-width="2"/>
  </svg><div class="between tiny muted" style="margin-top:4px"><span>${fmtD(c.de)}</span><span>${dia&&dia<tot?'hoje · dia '+dia:''}</span><span>${fmtD(c.ate)}</span></div>`;
}
function evolChart(mes){

  const max=Math.max(...data.map(d=>Math.max(d.g,d.r)),1)*1.1, gap=(W-n*bw)/(n+1), y=v=>H-22-(v/max)*(H-40);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${data.map((d,i)=>{const X=gap+i*(bw+gap),Y=y(d.g),over=d.r>0&&d.g>d.r*.8;

/* ============ DADOS ============ */
async function fetchAll(table, order, asc=true){
  const out=[]; const step=1000;
  for(let from=0;;from+=step){
    const {data,error}=await sb.from(table).select('*').order(order,{ascending:asc}).range(from,from+step-1);
    if(error) throw error; out.push(...(data||[])); if(!data || data.length<step) break;
  }
  return out;
}
async function carregar(){
  const [prof, cats, tx, fixas, rendas, reservas, aportes, patItens, patSnaps, faturas] = await Promise.all([
    sb.from('profiles').select('*').eq('id',USER.id).maybeSingle(),
    fetchAll('categorias','nome'), fetchAll('transacoes','data',false), fetchAll('despesas_fixas','nome'),
    fetchAll('rendas_fixas','id'), fetchAll('reservas','id'), fetchAll('aportes_reserva','data',false),
    fetchAll('patrimonio_itens','id'), fetchAll('patrimonio_snapshots','data'),
    fetchAll('faturas','vencimento').catch(()=>[])   // tabela da migração v2; sem ela o cartão conta pela data
  ]);
  const p = prof.data || {};
  P.nome = p.nome || USER.email; P.dia = Number(p.dia_inicio_mes)||1;
  P.fecha = p.cartao_dia_fechamento ? Number(p.cartao_dia_fechamento) : null;
  P.vence = p.cartao_dia_vencimento ? Number(p.cartao_dia_vencimento) : null;
  const meu = r => r.user_id===USER.id;
  D.cats = cats.map(c=>({...c, limite_mensal:num(c.limite_mensal)}));
  D.tx = tx.filter(meu).map(normTx);
  D.fixas = fixas.filter(meu).map(f=>({...f, valor:num(f.valor)}));
  D.rendas = rendas.filter(meu).map(r=>({...r, valor:num(r.valor)}));
  D.reservas = reservas.filter(meu).map(r=>({...r, valor_meta:num(r.valor_meta)}));
  D.aportes = aportes.filter(meu).map(normTx);
  D.patItens = patItens.filter(meu).map(a=>({...a, valor:num(a.valor)}));
  D.patSnaps = patSnaps.filter(meu).map(a=>({...a, data:String(a.data).slice(0,10), total_ativos:num(a.total_ativos), total_dividas:num(a.total_dividas)}));
  D.faturas = faturas.filter(meu).map(f=>({...f, valor:num(f.valor), vencimento:String(f.vencimento).slice(0,10)}));
  fila().forEach((row,i)=>D.tx.push({...normTx(row), id:'fila-'+i}));
  if(!S.mes) S.mes = mesAtual();
}
async function recarregar(){ try{ await carregar(); render(); }catch(e){ toast('Não consegui atualizar: '+traduzErro(e)); } }
async function q(promise, okMsg){
  const {data,error} = await promise;
  if(error){ toast(traduzErro(error)); throw error; }
  if(okMsg) toast(okMsg);
  return data;
}
function traduzErro(e){
  const m = e?.message||String(e);
  if(/está em uso/.test(m)) return m.slice(m.indexOf('A categoria'));
  if(/Failed to fetch|NetworkError|network|Load failed/i.test(m)) return 'Sem conexão. Tente de novo.';
  if(/JWT|expired/i.test(m)) return 'Sua sessão expirou. Entre de novo.';
  if(/duplicate key/i.test(m)) return 'Isso já foi registrado.';
  return 'Erro: '+m;
}
const ehErroRede = e => /Failed to fetch|NetworkError|Load failed|network/i.test(e?.message||'');

/* ---- fila offline (lançamentos e baixas feitos sem internet) ---- */
const FILA_KEY='fila_lancamentos';
const fila = () => { try{ return JSON.parse(localStorage.getItem(FILA_KEY)||'[]'); }catch(e){ return []; } };
const setFila = f => { try{ localStorage.setItem(FILA_KEY, JSON.stringify(f)); }catch(e){} };
let enviando=false;
async function enviarFila(){
  const f=fila(); if(!f.length || !USER || !navigator.onLine || enviando) return; enviando=true;
  const resto=[]; let ok=0;
  for(const row of f){ const {error}=await sb.from('transacoes').insert(row); if(error) resto.push(row); else ok++; }
  setFila(resto); enviando=false;
  if(ok){ toast(`${ok} lançamento${ok>1?'s':''} feito${ok>1?'s':''} sem internet ${ok>1?'foram enviados':'foi enviado'}`); await recarregar(); }
  else if(resto.length && USER) render();
}
addEventListener('online', enviarFila);
async function inserirTx(row){
  const offline = () => { const f=[...fila(), row]; setFila(f); D.tx.push({...normTx(row), id:'fila-'+(f.length-1)}); return {offline:true}; };
  if(!navigator.onLine) return offline();
  const {data,error} = await sb.from('transacoes').insert(row).select().single();
  if(error){ if(ehErroRede(error)) return offline(); toast(traduzErro(error)); throw error; }
  const t=normTx(data); D.tx.push(t); return {data:t};
}

function rendaEstimada(mes){ const c=calc(mes); if(c.renda) return {v:c.renda,est:false};
  for(let i=1;i<=6;i++){ const r=calc(addMes(mes,-i)).renda; if(r) return {v:r,est:true}; } return {v:0,est:true}; }
function previsao(mes){
  const c=calc(mes), r=rendaEstimada(mes);
  const lims=catsAtivas().filter(x=>x.limite_mensal>0).map(x=>({nome:x.nome,rest:Math.max(0,x.limite_mensal-(c.porCat[x.nome]||0))}));
  const limRest=lims.reduce((a,l)=>a+l.rest,0);
  const comprometido=c.pago+c.aporteTot+c.cartaoAberto+c.pendTot;
  const sobra=r.v-comprometido, sobraLim=sobra-limRest;
  return {mes,renda:r.v,rendaEst:r.est,pago:c.pago+c.aporteTot,cartao:c.cartaoAberto,fixas:c.pendTot,nFixas:c.pend.length,limRest,lims,sobra,sobraLim,meta:r.v*.2,aportes:c.aporteTot};
}

function fxRow(f,mes){

function viewAnalise(){
  const c=calc(S.mes), ant=calc(addMes(S.mes,-1));

  let rk=Object.entries(c.porCat).filter(([x])=>grupoDe(x)===S.rankF).sort((a,b)=>b[1]-a[1]);
  if(S.rankF==='Investimento'){ const pr={}; c.aportes.forEach(a=>{const r=D.reservas.find(x=>x.id===a.reserva_id);const n=r?r.nome:'Reserva';pr[n]=(pr[n]||0)+a.valor}); rk=Object.entries(pr).sort((a,b)=>b[1]-a[1]); }
  const max=rk[0]?.[1]||1, totF=rk.reduce((a,r)=>a+r[1],0);
  const cats=new Set([...Object.keys(c.porCat),...Object.keys(ant.porCat)]);
  const difs=[...cats].map(x=>({cat:x,a:ant.porCat[x]||0,b:c.porCat[x]||0})).map(d=>({...d,d:d.b-d.a})).filter(d=>Math.abs(d.d)>=1).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,8);
  const tot=c.gasto;
  return `<div class="stack fade">
   <div class="page-t"><div><h1>Análise</h1><p>Para onde o dinheiro foi em ${nomeMes(S.mes)}</p></div></div>
   <div class="card"><div class="card-h"><div><h3>Evolução mensal</h3><p>Gasto por mês pessoal (barras) e renda (tracejado)</p></div></div>${evolChart(S.mes)}</div>
   <div class="grid2">
    <div class="card"><div class="card-h"><div><h3>Fixo vs. variável</h3><p>Quanto do mês já nasce comprometido</p></div></div>
     ${tot?`<div class="row" style="gap:18px">${donut([{l:'Fixo',v:c.fixo,c:'var(--brand)'},{l:'Variável',v:c.vari,c:'var(--des)'}],130,16,`<div><div class="tiny muted">total</div><div class="money" style="font-size:14px">${k(tot)}</div></div>`)}
     <div class="stack" style="gap:8px;flex:1"><div><div class="row small"><i class="dotc" style="background:var(--brand)"></i>Fixo · ${pct(c.fixo,tot)}%</div><div class="money">${brl(c.fixo)}</div></div><div><div class="row small"><i class="dotc" style="background:var(--des)"></i>Variável · ${pct(c.vari,tot)}%</div><div class="money">${brl(c.vari)}</div></div></div></div>`:'<div class="empty">Sem gastos neste mês.</div>'}</div>
    <div class="card"><div class="card-h"><div><h3>Onde o dinheiro sai</h3><p>Por forma de pagamento</p></div>${ic('card')}</div>
     ${tot?`<div class="row" style="gap:18px">${donut(Object.entries(c.porForma).map(([l,v])=>({l,v,c:FC[l]||'#94A3B8'})),130,16,`<div><div class="tiny muted">cartão</div><div class="money" style="font-size:14px">${pct(c.porForma['Cartão de crédito']||0,tot)}%</div></div>`)}
     <div class="stack" style="gap:6px;flex:1">${Object.entries(c.porForma).sort((a,b)=>b[1]-a[1]).map(([l,v])=>`<div class="between small"><span class="row" style="gap:6px"><i class="dotc" style="background:${FC[l]||'#94A3B8'}"></i>${esc(l)}</span><b>${k(v)}</b></div>`).join('')}</div></div>`:'<div class="empty">Sem gastos neste mês.</div>'}</div>
   </div>
   <div class="card"><div class="card-h"><div><h3>Ranking por balde</h3><p>${brl(totF)} em ${S.rankF}${c.orc[S.rankF]?` · orçamento ${brl0(c.orc[S.rankF])}`:''}</p></div></div>
    <div class="seg" style="margin-bottom:10px">${GRUPOS.map(b=>`<button class="${S.rankF===b?'on':''}" onclick="S.rankF='${b}';render()">${b}</button>`).join('')}</div>
    ${rk.length?rk.map(([x,v])=>`<div class="rk"><div class="between"><span>${esc(x)}</span><b>${brl(v)}</b></div><div class="bar"><span style="width:${v/max*100}%;background:${COR[S.rankF]}"></span></div></div>`).join(''):`<div class="empty">Nada em ${S.rankF} neste mês.</div>`}
   </div>
   <div class="card"><div class="card-h"><div><h3>Comparativo com ${nomeMes(addMes(S.mes,-1))}</h3><p>Total ${brl(ant.gasto)} → ${brl(c.gasto)} <b style="color:${c.gasto>ant.gasto?'var(--bad)':'var(--ok)'}">${c.gasto>=ant.gasto?'▲':'▼'} ${brl0(Math.abs(c.gasto-ant.gasto))}</b></p></div></div>
    ${difs.length?difs.map(d=>`<div class="cmp"><span>${esc(d.cat)}</span><span class="muted">${brl0(d.a)} → <b style="color:var(--text)">${brl0(d.b)}</b> <b style="color:${d.d>0?'var(--bad)':'var(--ok)'}">${d.d>0?'▲':'▼'} ${brl0(Math.abs(d.d))}</b></span></div>`).join(''):'<div class="empty">Sem diferenças relevantes.</div>'}
   </div>
  </div>`;

const saldoRes = id => D.aportes.filter(a=>a.reserva_id===id).reduce((a,x)=>a+x.valor,0);
function resCard(r){
  const s=saldoRes(r.id),p=pct(s,r.valor_meta),falta=Math.max(0,r.valor_meta-s),cor=r.tipo==='emergencia'?'#10B981':['#2563EB','#7C3AED','#F59E0B','#0EA5E9','#EC4899'][r.id%5];
  let ritmo;
  if(!r.valor_meta) ritmo='Sem meta definida';
  else if(falta<=0) ritmo='Meta atingida 🎉';
  else if(r.data_alvo){ const meses=Math.max(1,Math.round((Date.parse(r.data_alvo)-Date.now())/(30.4*864e5))); ritmo=`Para ${fmtD(r.data_alvo)}/${r.data_alvo.slice(2,4)}: ${brl0(falta/meses)} por mês`; }
  else { const ult=D.aportes.filter(a=>a.reserva_id===r.id&&Date.parse(a.data)>Date.now()-90*864e5).reduce((a,x)=>a+x.valor,0)/3; ritmo= ult>0?`No ritmo dos últimos 3 meses, ${Math.ceil(falta/ult)} meses para chegar`:'Sem aportes nos últimos 3 meses'; }
  return `<div class="card"><div class="row" style="gap:14px">${ring(p,cor,68,7)}<div style="flex:1;min-width:0;cursor:pointer" onclick="openReserva(${r.id})">

   <button class="btn btn-ok btn-sm" onclick="openAporte(${r.id})">${ic('plus',14)} Aportar</button></div>
   <div class="between tiny muted" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><span>${ic('trend',13)} ${ritmo}</span><button class="link" onclick="openAportes(${r.id})">Aportes</button></div></div>`;
}
function viewPatrimonio(){

    ${snaps.length>1?`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none"><polyline points="${snaps.map((s,i)=>x(i)+','+y(vals[i])).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2.5"/>${snaps.map((s,i)=>`<circle cx="${x(i)}" cy="${y(vals[i])}" r="3.5" fill="var(--brand)"><title>${fmtDY(s.data)}: ${brl(vals[i])}</title></circle>`).join('')}</svg>`:'<div class="empty">Registre pelo menos dois meses para ver o gráfico.</div>'}</div>

const iniciais = () => (P.nome||'?').split(' ').filter(Boolean).slice(0,2).map(s=>s[0]).join('').toUpperCase();

/* ============ SHELL ============ */
const NAV=[['inicio','Início','home'],['analise','Análise','pie'],['lancar','Lançar','plus'],['fixas','Fixas','check'],['reservas','Reservas','piggy'],['ajustes','Ajustes','sliders']];
function render(){
  if(!USER) return;
  const root=document.getElementById('root');
  const views={inicio:viewInicio,analise:viewAnalise,fixas:viewFixas,reservas:viewReservas,ajustes:viewAjustes};
  const sc=root.querySelector('.scroll')?.scrollTop||0;
  const {de,ate}=periodo(S.mes), showAI=ASSISTENTE_IDS.includes(USER.id);
  const titulo={inicio:'Visão geral',analise:'Análise',fixas:'Fixas',reservas:'Reservas',ajustes:'Ajustes'}[S.tab];
  root.innerHTML=`<div class="app ${S.chatOpen?'chat-open':''} ${S.selMode&&S.tab==='fixas'?'sel-mode':''}">
   <aside class="side"><div class="logo"><div class="logo-mark">50</div><div><b>Painel 50/30/20</b><small>${P.dia>1?`Mês do dia ${P.dia} ao ${P.dia-1}`:'Mês de calendário'}</small></div></div>
    <button class="btn btn-primary btn-block" style="margin-bottom:14px" onclick="openLancar()">${ic('plus')} Lançar</button>
    ${NAV.filter(n=>n[0]!=='lancar').map(n=>`<button class="nav-item ${S.tab===n[0]?'on':''}" onclick="go('${n[0]}')">${ic(n[2])} ${n[1]}</button>`).join('')}
    <button class="nav-item" onclick="openHist()">${ic('list')} Histórico</button>
    ${showAI?`<button class="nav-item" onclick="openChat()">${ic('spark')} Assistente</button>`:''}
    <div class="foot"><div class="avatar">${esc(iniciais())}</div><div><b>${esc(P.nome)}</b><small>Conta pessoal</small></div></div></aside>
   <div class="main">
    <header class="top"><div class="hello"><button class="avatar" onclick="go('ajustes')" title="Ajustes">${esc(iniciais())}</button><div><small>Olá, ${esc((P.nome||'').split(' ')[0])}</small><b>${titulo}</b></div></div>
     <div class="row" style="gap:2px"><button class="icon-btn" title="Tema: ${({auto:'automático',light:'claro',dark:'escuro'})[S.theme]} (toque para trocar)" onclick="ciclaTema()">${ic(S.theme==='light'?'sun':S.theme==='dark'?'moon':'auto',17)}</button><button class="icon-btn" title="Histórico" onclick="openHist()">${ic('list',17)}</button>
     <div class="cycle"><button onclick="mudaMes(-1)" aria-label="Mês anterior">${ic('left',16)}</button><div class="lbl" onclick="S.mes=mesAtual();render()" title="Voltar para o mês atual"><b>${nomeMes(S.mes)}</b><span>${fmtD(de)} – ${fmtD(ate)}</span></div><button onclick="mudaMes(1)" aria-label="Próximo mês">${ic('right',16)}</button></div></div></header>
    <div class="scroll"><div class="wrap">${views[S.tab]()}</div></div>
   </div>
   <nav class="bottom">${NAV.filter(n=>n[0]!=='ajustes').map(n=>n[0]==='lancar'
     ?`<button onclick="openLancar()"><span class="fab">${ic('plus')}</span><span style="margin-top:2px">Lançar</span></button>`
     :`<button class="${S.tab===n[0]?'on':''}" onclick="go('${n[0]}')"><span class="dot">${ic(n[2])}</span>${n[1]}</button>`).join('')}</nav>
   ${showAI?`<button class="ai-fab" onclick="openChat()" aria-label="Assistente">${ic('spark')}<span class="lbl">Assistente</span></button>`:''}
  </div>`;
  const s=root.querySelector('.scroll'); if(s&&!go.jump) s.scrollTop=sc; go.jump=false;
}
function go(t){ S.tab=t; S.selMode=false; S.sel=[]; go.jump=true; closeSheet(); render(); }
function mudaMes(n){ S.mes=addMes(S.mes,n); S.selMode=false; S.sel=[]; render(); }
function applyTheme(){ if(S.theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',S.theme); }
function ciclaTema(){ const n={auto:'light',light:'dark',dark:'auto'}[S.theme]; setTheme(n); toast('Tema: '+({auto:'automático (segue o celular)',light:'claro',dark:'escuro'})[n]); }
function setTheme(t){ S.theme=t; try{localStorage.setItem('tema',t)}catch(e){} applyTheme(); render(); }

let tt; function toast(msg,actLbl,act){ const el=document.getElementById('toast'); el.innerHTML=`<span>${esc(msg)}</span>${actLbl?`<button id="tact">${esc(actLbl)}</button>`:''}`; if(actLbl) document.getElementById('tact').onclick=()=>{el.classList.remove('show');act();}; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),actLbl?6000:2800); }

/* ============ GAVETAS ============ */
function sheet(title,sub,body){ document.getElementById('layer').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="grab"></div><div class="sheet-h"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button class="xbtn" onclick="closeSheet()" aria-label="Fechar">${ic('x',16)}</button></div><div class="sheet-b">${body}</div></div></div>`; }
const sheetBody = html => { const b=document.querySelector('.sheet-b'); if(b) b.innerHTML=html; };
function closeSheet(){ document.getElementById('layer').innerHTML=''; }
let CONF=null;
function confirmar(titulo,texto,btn,fn){ CONF=fn; sheet(titulo,'',`<div class="confirm-ico">${ic('alert')}</div><p class="small" style="text-align:center;line-height:1.5">${texto}</p><div class="two"><button class="btn btn-soft btn-block" onclick="closeSheet()">Cancelar</button><button class="btn btn-danger btn-block" id="cbtn" onclick="runConf()">${btn}</button></div>`); }
async function runConf(){ const b=document.getElementById('cbtn'); b.disabled=true; try{ await CONF(); closeSheet(); }catch(e){ b.disabled=false; } }
const catOptions = (sel, incluirInv=true) => GRUPOS.filter(g=>incluirInv||g!=='Investimento').map(b=>{const cs=catsAtivas().filter(x=>x.grupo===b); return cs.length?`<optgroup label="${b} (${PCT[b]}%)">${cs.map(x=>`<option value="${esc(x.nome)}" ${sel===x.nome?'selected':''}>${esc(x.nome)}</option>`).join('')}</optgroup>`:''}).join('');
const formaChips = (cur, fn, lista=FORMAS) => `<div class="chips">${lista.map(f=>`<button class="chip ${cur===f?'on':''}" onclick="${fn}('${f}')">${f}</button>`).join('')}</div>`;
function selCategoria(id, sel, onchange, incluirInv=true, disabled=false){ const g=sel?grupoDe(sel):null;
  return `<div class="sel-wrap">${g?`<i class="dotc sel-dot" style="background:${COR[g]}"></i>`:''}<select class="input sel ${g?'has-dot':''}" id="${id}" onchange="${onchange}" ${disabled?'disabled':''}><option value="" ${sel?'':'selected'} disabled>Escolha a categoria</option>${catOptions(sel,incluirInv)}</select></div>`; }

/* --- Lançar / editar --- */
let L={};
function openLancar(id){
  const t = id ? D.tx.find(x=>x.id===id) : null;
  L = t ? {id:t.id, tipo:t.tipo, cat:t.categoria, forma:t.forma_pagamento||S.lastPay, data:t.data, v:fmtV(t.valor), obs:t.obs||'', fixa:t.despesa_fixa_id}
        : {tipo:'Despesa', cat:null, forma:S.lastPay, data:hoje(), v:'', obs:'', res:null};
  sheet(t?'Editar lançamento':'Novo lançamento', t?(t.despesa_fixa_id?'Baixa de despesa fixa':fmtDY(t.data)):'', lancarBody());
  chkL(); if(!t) setTimeout(()=>document.getElementById('lv')?.focus(),250);
}
function lancarBody(){
  const g=L.cat?grupoDe(L.cat):null, inv=g==='Investimento', h=hoje(), o=ontem(), outra=L.data!==h&&L.data!==o;
  const venc = L.tipo==='Despesa' && L.forma==='Cartão de crédito' && !L.fixa && !inv && temCartao() ? faturaVenc(L.data) : null;
  const mesDest = venc ? mesFiscal(venc) : mesFiscal(L.data);
  const res = D.reservas.filter(r=>r.ativo!=='Não');
  return `${L.id?'':`<div class="seg">${['Despesa','Receita'].map(t=>`<button class="${L.tipo===t?'on':''}" onclick="guardaL();L.tipo='${t}';L.cat=null;relancar()">${t}</button>`).join('')}</div>`}
  <div class="amount"><div class="tiny muted" style="font-weight:600">Valor</div><div class="r"><span>R$</span><input id="lv" inputmode="numeric" placeholder="0,00" oninput="maskV(this);chkL()" value="${L.v||''}"></div></div>
  ${L.tipo==='Despesa'?`<div class="field"><label>Categoria</label>${selCategoria('lc',L.cat,"guardaL();L.cat=this.value||null;relancar()",!L.id,!!L.fixa)}
   ${g?`<div class="dest" style="margin-top:8px"><i class="dotc" style="background:${COR[g]}"></i>${inv?'Vira um <b>aporte</b> numa reserva (balde Investimento)':`Conta no balde <b>${g}</b>`}</div>`:''}</div>
   ${inv?`<div class="field"><label>Reserva</label>${res.length?`<div class="chips">${res.map(r=>`<button class="chip ${L.res===r.id?'on':''}" onclick="guardaL();L.res=${r.id};relancar()">${esc(r.nome)}</button>`).join('')}</div>`:'<div class="dest">Crie uma reserva em Reservas primeiro.</div>'}</div>`
   :`<div class="field"><label>Pago com</label>${formaChips(L.forma,"guardaL();setForma")}</div>`}`:''}
  <div class="field"><label>Quando</label><div class="chips">${[[h,'Hoje · '+fmtD(h)],[o,'Ontem · '+fmtD(o)]].map(d=>`<button class="chip ${L.data===d[0]?'on':''}" onclick="guardaL();L.data='${d[0]}';relancar()">${d[1]}</button>`).join('')}
   <label class="chip ${outra?'on':''}">${ic('cal',14)} ${outra?fmtDY(L.data):'Outra data'}<input type="date" value="${L.data}" onclick="try{this.showPicker()}catch(e){}" onchange="if(this.value){guardaL();L.data=this.value;relancar()}" style="position:absolute;inset:0;opacity:0;width:100%;cursor:pointer"></label></div>
   ${L.tipo==='Despesa'&&!inv&&(venc||mesDest!==mesAtual())?`<div class="dest" style="margin-top:8px">${ic(venc?'card':'cal',14)}<span>${venc?`Vai na fatura que vence <b>${fmtD(venc)}</b>: fica prevista em <b>${nomeMes(mesDest)}</b> e conta como paga quando você pagar a fatura`:`Conta em <b>${nomeMes(mesDest)}</b>`}</span></div>`:''}</div>
  <div class="field"><label>Descrição</label><input class="input" id="ld" placeholder="${L.tipo==='Despesa'?'Ex: Mercado do dia':'Ex: Salário, freela'}" value="${esc(L.obs||'')}" oninput="chkL()" ${L.fixa?'disabled':''}></div>
  <button class="btn btn-primary btn-block" id="lsave" onclick="saveL()" disabled>${ic('tick')} ${L.id?'Salvar alterações':'Salvar lançamento'}</button>
  ${L.id?`<button class="btn btn-soft btn-block" style="color:var(--bad)" onclick="askDelTx(${L.id})">${ic('trash',16)} Excluir lançamento</button>`:''}`;
}
function setForma(f){ L.forma=f; relancar(); }
function relancar(){ sheetBody(lancarBody()); chkL(); }
function guardaL(){ const v=document.getElementById('lv'), d=document.getElementById('ld'); if(v) L.v=v.value; if(d) L.obs=d.value; }
function chkL(){ const b=document.getElementById('lsave'); if(!b) return; const inv=L.cat&&grupoDe(L.cat)==='Investimento';
  const ok=parseV(document.getElementById('lv').value)>0 && (L.fixa||document.getElementById('ld').value.trim()) && (L.tipo==='Receita'||(L.cat&&(!inv||L.res))); b.disabled=!ok; }
async function saveL(){
  guardaL(); const b=document.getElementById('lsave'); b.disabled=true;
  const v=parseV(L.v), obs=(L.obs||'').trim(), inv=L.cat&&grupoDe(L.cat)==='Investimento';
  try{
    if(inv && !L.id){
      const d=normTx(await q(sb.from('aportes_reserva').insert({reserva_id:L.res,user_id:USER.id,valor:v,data:L.data,obs:obs||null}).select().single()));
      D.aportes.push(d); closeSheet(); render(); const r=D.reservas.find(x=>x.id===L.res);
      return toast(`+ ${brl(v)} em ${r?r.nome:'reserva'}`,'Desfazer',async()=>{await q(sb.from('aportes_reserva').delete().eq('id',d.id));D.aportes=D.aportes.filter(a=>a.id!==d.id);render();});
    }
    const row={user_id:USER.id,data:L.data,tipo:L.tipo,categoria:L.tipo==='Receita'?null:L.cat,valor:v,obs:obs||null,forma_pagamento:L.tipo==='Receita'?null:L.forma};
    if(L.id){
      const upd = L.fixa ? {valor:v,data:L.data,forma_pagamento:L.forma} : {data:row.data,categoria:row.categoria,valor:v,obs:row.obs,forma_pagamento:row.forma_pagamento};
      const d=normTx(await q(sb.from('transacoes').update(upd).eq('id',L.id).select().single()));
      D.tx[D.tx.findIndex(t=>t.id===L.id)]=d; closeSheet(); render(); return toast('Lançamento atualizado');
    }
    row.origem='painel';
    const r=await inserirTx(row);
    if(L.tipo==='Despesa'){ S.lastPay=L.forma; try{localStorage.setItem('ultimaForma',L.forma)}catch(e){} }
    closeSheet(); render();
    if(r.offline) return toast('Sem internet: guardado no celular. Envio automático quando a conexão voltar.');
    const venc = ehCartaoVar(r.data) ? faturaVenc(r.data.data) : null;
    toast(`${L.tipo==='Receita'?'+':'-'} ${brl(v)}${venc?` · fatura de ${fmtD(venc)}`:''}`,'Desfazer',async()=>{await q(sb.from('transacoes').delete().eq('id',r.data.id));D.tx=D.tx.filter(x=>x.id!==r.data.id);render();});
  }catch(e){ b.disabled=false; }
}
function askDelTx(id){
  const t=D.tx.find(x=>x.id===id);
  confirmar('Excluir lançamento?',`Você vai excluir <b>${esc(t.obs||t.categoria||'lançamento')}</b> (${brl(t.valor)}).${t.despesa_fixa_id?'<br>É a baixa de uma despesa fixa: ela volta a ficar pendente.':''}<br><span class="muted tiny">Fica 90 dias na lixeira.</span>`,'Excluir',async()=>{
    await q(sb.from('transacoes').delete().eq('id',id)); D.tx=D.tx.filter(x=>x.id!==id); render();
    const {id:_,...copia}=t; toast('Lançamento excluído','Desfazer',async()=>{const d=normTx(await q(sb.from('transacoes').insert(copia).select().single()));D.tx.push(d);render();});
  });
}

/* --- Despesas fixas --- */
let F={};
function openFixa(id){
  const f=id?D.fixas.find(x=>x.id===id):null;
  F=f?{...f, v:fmtV(f.valor)}:{nome:'',categoria:null,v:'',data_inicio:periodo(S.mes).de,data_fim:'',dia_vencimento:'',forma_pagamento_padrao:''};
  sheet(f?'Editar despesa fixa':'Nova despesa fixa', f?'Mudanças valem daqui em diante; baixas já dadas não mudam.':'Só conta como gasto quando você der baixa', fixaBody());
}
function fixaBody(){
  return `<div class="field"><label>Nome</label><input class="input" id="fn" value="${esc(F.nome)}" placeholder="Ex: Aluguel, Netflix, Parcela do sofá"></div>
  <div class="two"><div class="field"><label>Valor de referência</label><input class="input" id="fv" inputmode="numeric" placeholder="0,00" value="${F.v}" oninput="maskV(this)"></div>
   <div class="field"><label>Vence dia (opcional)</label><input class="input" id="fd" type="number" min="1" max="31" value="${F.dia_vencimento||''}"></div></div>
  <div class="field"><label>Categoria</label>${selCategoria('fc',F.categoria,"guardaF();F.categoria=this.value;sheetBody(fixaBody())",false)}</div>
  <div class="two"><div class="field"><label>Começa em</label><input class="input" id="fi" type="date" value="${F.data_inicio||''}"></div><div class="field"><label>Termina em (opcional)</label><input class="input" id="ff" type="date" value="${F.data_fim||''}"></div></div>
  <div class="field"><label>Forma de pagamento padrão</label>${formaChips(F.forma_pagamento_padrao,"setFormaF")}<p class="tiny muted" style="margin-top:6px">${temCartao()?'Fixas no cartão recebem baixa junto quando você paga a fatura.':'Já vem marcada na hora de dar baixa.'}</p></div>
  <button class="btn btn-primary btn-block" id="fsave" onclick="saveFixa()">${ic('tick')} ${F.id?'Salvar':'Adicionar despesa fixa'}</button>
  ${F.id?`<div class="two"><button class="btn btn-soft btn-block" onclick="encerrarFixa(${F.id})">Encerrar em ${nomeMes(S.mes)}</button><button class="btn btn-soft btn-block" style="color:var(--bad)" onclick="askDelFixa(${F.id})">${ic('trash',16)} Excluir</button></div>`:''}`;
}
function guardaF(){ const g=id=>document.getElementById(id); if(!g('fn')) return; F.nome=g('fn').value; F.v=g('fv').value; F.dia_vencimento=g('fd').value; F.data_inicio=g('fi').value; F.data_fim=g('ff').value; }
function setFormaF(f){ guardaF(); F.forma_pagamento_padrao = F.forma_pagamento_padrao===f ? '' : f; sheetBody(fixaBody()); }
async function saveFixa(){
  guardaF(); const b=document.getElementById('fsave');
  const row={nome:(F.nome||'').trim(),valor:parseV(F.v),categoria:F.categoria,data_inicio:F.data_inicio||null,data_fim:F.data_fim||null,dia_vencimento:F.dia_vencimento?Number(F.dia_vencimento):null,forma_pagamento_padrao:F.forma_pagamento_padrao||null};
  if(!row.nome||!row.valor||!row.categoria) return toast('Preencha nome, valor e categoria');
  b.disabled=true;
  try{
    if(F.id){ const d=await q(sb.from('despesas_fixas').update(row).eq('id',F.id).select().single()); D.fixas[D.fixas.findIndex(x=>x.id===F.id)]={...d,valor:num(d.valor)}; }
    else { const d=await q(sb.from('despesas_fixas').insert({...row,user_id:USER.id,ativo:'Sim'}).select().single()); D.fixas.push({...d,valor:num(d.valor)}); }
    closeSheet(); render(); toast(F.id?'Despesa fixa atualizada':'Despesa fixa adicionada');
  }catch(e){ b.disabled=false; }
}
async function encerrarFixa(id){ const fim=periodo(S.mes).ate; const d=await q(sb.from('despesas_fixas').update({data_fim:fim}).eq('id',id).select().single()); D.fixas[D.fixas.findIndex(x=>x.id===id)]={...d,valor:num(d.valor)}; closeSheet(); render(); toast(`Encerrada: não aparece depois de ${nomeMes(S.mes)}`); }
function askDelFixa(id){ const f=D.fixas.find(x=>x.id===id), n=D.tx.filter(t=>t.despesa_fixa_id===id).length;
  confirmar('Excluir despesa fixa?',`<b>${esc(f.nome)}</b>${n?` tem <b>${n} baixa${n>1?'s':''}</b> no histórico. Elas continuam contando nos meses em que foram pagas.<br>Se ela só acabou, prefira <b>Encerrar</b>.`:' não tem baixas.'}<br><span class="muted tiny">Fica 90 dias na lixeira.</span>`,'Excluir',async()=>{ await q(sb.from('despesas_fixas').delete().eq('id',id)); D.fixas=D.fixas.filter(x=>x.id!==id); D.tx.forEach(t=>{if(t.despesa_fixa_id===id)t.despesa_fixa_id=null}); render(); toast('Despesa fixa excluída'); }); }
function openFixasTodas(){
  const l=[...D.fixas].sort((a,b)=>Number(fixaVigente(b,mesAtual()))-Number(fixaVigente(a,mesAtual()))||a.nome.localeCompare(b.nome));
  sheet('Despesas fixas cadastradas',`${l.length} no total · toque para editar`,`<div>${l.map(f=>{const ativa=fixaVigente(f,mesAtual());return `<div class="list-row" onclick="openFixa(${f.id})"><span class="small" style="min-width:0"><b>${esc(f.nome)}</b><span class="muted"> · ${esc(f.categoria)}${f.data_fim?' · até '+fmtD(f.data_fim)+'/'+f.data_fim.slice(2,4):''}</span></span><span class="row" style="gap:6px;flex-shrink:0"><span class="badge ${ativa?'b-ok':'b-mute'}">${ativa?'Ativa':'Encerrada'}</span><b class="small">${brl(f.valor)}</b></span></div>`}).join('')}</div>`);
}
// baixa individual
function openBaixa(id){ const f=D.fixas.find(x=>x.id===id); L={forma:f.forma_pagamento_padrao||S.lastPay, fid:id, data:hoje(), v:fmtV(f.valor)}; sheet('Dar baixa',`${esc(f.nome)} · ${esc(f.categoria)}`,baixaBody()); }
function baixaBody(){ const f=D.fixas.find(x=>x.id===L.fid);
  return `<div class="amount"><div class="tiny muted" style="font-weight:600">Valor pago</div><div class="r"><span>R$</span><input id="bv" inputmode="numeric" value="${L.v}" oninput="maskV(this);L.v=this.value"></div><div class="tiny muted">Referência ${brl(f.valor)}</div></div>
  <div class="field"><label>Pago com</label>${formaChips(L.forma,"setFormaB")}</div>
  <div class="field"><label>Data do pagamento</label><input class="input" type="date" id="bd" value="${L.data}" onchange="L.data=this.value"></div>
  <button class="btn btn-primary btn-block" id="bok" onclick="doBaixa()">${ic('tick')} Confirmar pagamento</button>`; }
function setFormaB(f){ L.forma=f; sheetBody(baixaBody()); }
async function doBaixa(){
  const f=D.fixas.find(x=>x.id===L.fid), v=parseV(L.v); if(!v) return toast('Informe o valor');
  document.getElementById('bok').disabled=true;
  try{ const r=await inserirTx({user_id:USER.id,data:L.data||hoje(),tipo:'Despesa',categoria:f.categoria,valor:v,obs:'Baixa: '+f.nome,forma_pagamento:L.forma,despesa_fixa_id:f.id,origem:'painel'});
    closeSheet(); render(); if(r.offline) return toast('Sem internet: baixa guardada para enviar depois');
    toast(`${f.nome} paga · ${brl(v)}`,'Desfazer',()=>undoBaixa(r.data.id,true));
  }catch(e){ const b=document.getElementById('bok'); if(b) b.disabled=false; }
}
async function undoBaixa(txId,silent){ const t=D.tx.find(x=>x.id===txId); await q(sb.from('transacoes').delete().eq('id',txId)); D.tx=D.tx.filter(x=>x.id!==txId); render(); if(!silent) toast('Baixa removida'+(t&&t.obs?' de '+t.obs.replace('Baixa: ',''):'')); }
// baixa em massa
function toggleSel(){ S.selMode=!S.selMode; S.sel=[]; if(S.selMode) S.fxF='pendentes'; render(); }
function pick(id){ S.sel=S.sel.includes(id)?S.sel.filter(x=>x!==id):[...S.sel,id]; render(); }
function selAll(){ const pd=calc(S.mes).pend.map(f=>f.id); S.sel=S.sel.length===pd.length?[]:pd; render(); }
function openBulk(){ L={forma:S.lastPay, data:hoje()}; sheet('Dar baixa em '+S.sel.length,'Valor de referência de cada uma',bulkBody()); }
function bulkBody(){ const its=D.fixas.filter(f=>S.sel.includes(f.id)), tot=its.reduce((a,f)=>a+f.valor,0);
  return `<div class="amount"><div class="tiny muted" style="font-weight:600">Total</div><div class="money" style="font-size:32px">${brl(tot)}</div></div>
  <div class="field"><label>Pago com (vale para todas)</label>${formaChips(L.forma,"setFormaBulk")}</div>
  <div class="field"><label>Data do pagamento</label><input class="input" type="date" value="${L.data}" onchange="L.data=this.value"></div>
  <div class="field"><label>Itens</label><div class="bulk-list">${its.map(f=>`<div class="between small"><span>${esc(f.nome)}</span><b>${brl(f.valor)}</b></div>`).join('')}</div><p class="tiny muted" style="margin-top:6px">Se alguma veio com valor diferente, tire da seleção e dê baixa nela sozinha.</p></div>
  <button class="btn btn-primary btn-block" id="bkok" onclick="doBulk()">${ic('tick')} Confirmar ${its.length} pagamento${its.length>1?'s':''}</button>`; }
function setFormaBulk(f){ L.forma=f; sheetBody(bulkBody()); }
async function doBulk(){
  document.getElementById('bkok').disabled=true;
  const its=D.fixas.filter(f=>S.sel.includes(f.id)), forma=L.forma, data=L.data||hoje();
  const rows=its.map(f=>({user_id:USER.id,data,tipo:'Despesa',categoria:f.categoria,valor:f.valor,obs:'Baixa: '+f.nome,forma_pagamento:forma,despesa_fixa_id:f.id,origem:'painel'}));
  try{ const ins=(await q(sb.from('transacoes').insert(rows).select())).map(normTx); D.tx.push(...ins);
    S.lastPay=forma; S.selMode=false; S.sel=[]; closeSheet(); render();
    const ids=ins.map(t=>t.id), tot=rows.reduce((a,r)=>a+r.valor,0);
    toast(`${ids.length} fixa${ids.length>1?'s':''} paga${ids.length>1?'s':''} · ${brl(tot)}`,'Desfazer',async()=>{await q(sb.from('transacoes').delete().in('id',ids));D.tx=D.tx.filter(t=>!ids.includes(t.id));render();});
  }catch(e){ const b=document.getElementById('bkok'); if(b) b.disabled=false; }
}

   ${f.fixas.length?`<div class="field"><label>Parcelas e assinaturas a dar baixa (${f.fixas.length})</label><div class="bulk-list">${f.fixas.map(x=>`<div class="between small"><span>${esc(x.nome)}</span><b>${brl(x.valor)}</b></div>`).join('')}</div></div>`:''}

}
function openPagarFatura(venc){ L={forma:'Pix', data:hoje(), venc, v:fmtV(faturaInfo(venc).total)}; sheet('Pagar fatura',`Vence ${fmtDY(venc)}`,pagarFaturaBody()); }
function pagarFaturaBody(){ const f=faturaInfo(L.venc);
  return `<div class="amount"><div class="tiny muted" style="font-weight:600">Valor pago</div><div class="r"><span>R$</span><input id="pfv" inputmode="numeric" value="${L.v}" oninput="maskV(this);L.v=this.value"></div><div class="tiny muted">Lançado no app: ${brl(f.total)}. Se o banco cobrou outro valor, ajuste aqui.</div></div>
   <div class="field"><label>Pago com</label>${formaChips(L.forma,"setFormaPF",['Pix','Débito','Dinheiro'])}</div>
   <div class="field"><label>Data do pagamento</label><input class="input" type="date" value="${L.data}" onchange="L.data=this.value"></div>
   <div class="dest">${ic('check',16)}<span>As <b>${f.itens.length} compra${f.itens.length===1?'':'s'}</b> passam a contar como pagas${f.fixas.length?` e <b>${f.fixas.length} fixa${f.fixas.length>1?'s':''} no cartão</b> recebe${f.fixas.length>1?'m':''} baixa`:''}.</span></div>
   <button class="btn btn-primary btn-block" id="pfok" onclick="doPagarFatura()">${ic('tick')} Confirmar pagamento</button>`; }
function setFormaPF(f){ L.forma=f; sheetBody(pagarFaturaBody()); }
async function doPagarFatura(){
  const b=document.getElementById('pfok'); b.disabled=true;
  const venc=L.venc, f=faturaInfo(venc), valor=parseV(L.v), data=L.data||hoje();
  try{
    const fat=await q(sb.from('faturas').insert({user_id:USER.id,vencimento:venc,valor,pago_em:data,forma_pagamento:L.forma}).select().single());
    D.faturas.push({...fat,valor:num(fat.valor),vencimento:String(fat.vencimento).slice(0,10)});
    let ids=[];
    if(f.fixas.length){ const rows=f.fixas.map(x=>({user_id:USER.id,data,tipo:'Despesa',categoria:x.categoria,valor:x.valor,obs:'Baixa: '+x.nome,forma_pagamento:'Cartão de crédito',despesa_fixa_id:x.id,origem:'painel'}));
      const ins=(await q(sb.from('transacoes').insert(rows).select())).map(normTx); D.tx.push(...ins); ids=ins.map(t=>t.id); }
    closeSheet(); render();
    toast(`Fatura paga · ${brl(valor)}`,'Desfazer',async()=>{ await q(sb.from('faturas').delete().eq('id',fat.id)); if(ids.length) await q(sb.from('transacoes').delete().in('id',ids)); D.faturas=D.faturas.filter(x=>x.id!==fat.id); D.tx=D.tx.filter(t=>!ids.includes(t.id)); render(); });

function askReabrirFatura(venc){ const r=faturaReg(venc); confirmar('Reabrir fatura?',`As compras da fatura de ${fmtD(venc)} voltam a contar como <b>previstas</b>. As baixas das fixas no cartão continuam; desfaça em Fixas se precisar.`,'Reabrir',async()=>{ await q(sb.from('faturas').delete().eq('id',r.id)); D.faturas=D.faturas.filter(x=>x.id!==r.id); render(); toast('Fatura reaberta'); }); }

/* --- Reservas e aportes --- */
let R={};
function openReserva(id){ const r=id?D.reservas.find(x=>x.id===id):null; R=r?{...r}:{tipo:'meta'};
  sheet(r?'Editar reserva':'Nova reserva','',`<div class="field"><label>Nome</label><input class="input" id="rn" value="${esc(r?r.nome:'')}" placeholder="Ex: Viagem, IPVA 2027"></div>
   <div class="field"><label>Tipo</label><div class="seg"><button class="${R.tipo!=='emergencia'?'on':''}" onclick="R.tipo='meta';[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')">Meta</button><button class="${R.tipo==='emergencia'?'on':''}" onclick="R.tipo='emergencia';[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')">Fundo de emergência</button></div></div>
   <div class="two"><div class="field"><label>Meta (R$)</label><input class="input" id="rv" inputmode="numeric" value="${r?fmtV(r.valor_meta):''}" oninput="maskV(this)" placeholder="0,00"></div><div class="field"><label>Data alvo (opcional)</label><input class="input" id="rd" type="date" value="${r?.data_alvo||''}"></div></div>
   <p class="tiny muted">Referência para emergência: 6x seu gasto médio de Necessário ≈ ${brl0(sugEmerg())}.</p>
   <button class="btn btn-primary btn-block" id="rsave" onclick="saveReserva()">${ic('tick')} ${r?'Salvar':'Criar reserva'}</button>
   ${r?`<button class="btn btn-soft btn-block" style="color:var(--bad)" onclick="askDelReserva(${r.id})">${ic('trash',16)} Excluir reserva</button>`:''}`); }
function sugEmerg(){ let t=0; for(let i=1;i<=3;i++) t+=calc(addMes(mesAtual(),-i)).g['Necessário'].pago; return t/3*6; }
async function saveReserva(){ const g=id=>document.getElementById(id); const row={nome:g('rn').value.trim(),tipo:R.tipo||'meta',valor_meta:parseV(g('rv').value),data_alvo:g('rd').value||null};
  if(!row.nome) return toast('Dê um nome à reserva'); g('rsave').disabled=true;
  try{ if(R.id){ const d=await q(sb.from('reservas').update(row).eq('id',R.id).select().single()); D.reservas[D.reservas.findIndex(x=>x.id===R.id)]={...d,valor_meta:num(d.valor_meta)}; }
    else { const d=await q(sb.from('reservas').insert({...row,user_id:USER.id,ativo:'Sim'}).select().single()); D.reservas.push({...d,valor_meta:num(d.valor_meta)}); }
    closeSheet(); render(); toast('Reserva salva'); }catch(e){ g('rsave').disabled=false; } }
function askDelReserva(id){ const r=D.reservas.find(x=>x.id===id), n=D.aportes.filter(a=>a.reserva_id===id).length;
  confirmar('Excluir reserva?',`<b>${esc(r.nome)}</b> e os <b>${n} aporte${n===1?'':'s'}</b> dela (${brl(saldoRes(id))}) serão excluídos.<br><span class="muted tiny">Ficam 90 dias na lixeira.</span>`,'Excluir',async()=>{ await q(sb.from('reservas').delete().eq('id',id)); D.reservas=D.reservas.filter(x=>x.id!==id); D.aportes=D.aportes.filter(a=>a.reserva_id!==id); render(); toast('Reserva excluída'); }); }
function openAporte(id, aporteId){
  const a=aporteId?D.aportes.find(x=>x.id===aporteId):null, res=D.reservas.filter(r=>r.ativo!=='Não');
  if(!res.length){ S.tab='reservas'; render(); toast('Crie uma reserva primeiro'); return openReserva(); }
  L={res:a?a.reserva_id:(id||(res.find(r=>r.tipo==='emergencia')||res[0]).id), aid:aporteId||null};
  const c=calc(mesAtual()), falta=Math.max(0,c.orc['Investimento']-c.g['Investimento'].pago);
  sheet(a?'Editar aporte':'Aportar','Conta no balde Investimento',`<div class="chips" id="arch">${res.map(x=>`<button class="chip ${L.res===x.id?'on':''}" onclick="L.res=${x.id};document.querySelectorAll('#arch .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${esc(x.nome)}</button>`).join('')}</div>
   <div class="amount"><div class="tiny muted" style="font-weight:600">Valor</div><div class="r"><span>R$</span><input id="av" inputmode="numeric" placeholder="0,00" value="${a?fmtV(a.valor):''}" oninput="maskV(this)"></div>
   ${!a&&falta>0?`<div class="chips" style="justify-content:center;margin-top:8px">${[500,1000].filter(v=>v<falta).map(v=>`<button class="chip" onclick="document.getElementById('av').value='${fmtV(v)}'">${brl0(v)}</button>`).join('')}<button class="chip" onclick="document.getElementById('av').value='${fmtV(Math.round(falta*100)/100)}'">O que falta dos 20% (${brl0(falta)})</button></div>`:''}</div>
   <div class="field"><label>Data</label><input class="input" type="date" id="ad" value="${a?a.data:hoje()}"></div>
   <button class="btn btn-block" id="aok" style="background:var(--ok);color:#fff" onclick="doAporte()">${ic('tick')} ${a?'Salvar':'Registrar aporte'}</button>
   ${a?`<button class="btn btn-soft btn-block" style="color:var(--bad)" onclick="delAporte(${a.id})">${ic('trash',16)} Excluir aporte</button>`:''}`);
  setTimeout(()=>document.getElementById('av')?.focus(),250);
}
async function doAporte(){ const v=parseV(document.getElementById('av').value), data=document.getElementById('ad').value||hoje(); if(!v) return toast('Informe o valor');
  document.getElementById('aok').disabled=true;
  try{ if(L.aid){ const d=normTx(await q(sb.from('aportes_reserva').update({valor:v,data,reserva_id:L.res}).eq('id',L.aid).select().single())); D.aportes[D.aportes.findIndex(x=>x.id===L.aid)]=d; closeSheet(); render(); return toast('Aporte atualizado'); }
    const d=normTx(await q(sb.from('aportes_reserva').insert({reserva_id:L.res,user_id:USER.id,valor:v,data}).select().single())); D.aportes.push(d); closeSheet(); render();
    const r=D.reservas.find(x=>x.id===L.res); toast(`+ ${brl(v)} em ${r.nome}`,'Desfazer',async()=>{await q(sb.from('aportes_reserva').delete().eq('id',d.id));D.aportes=D.aportes.filter(a=>a.id!==d.id);render();});
  }catch(e){ const b=document.getElementById('aok'); if(b) b.disabled=false; } }
async function delAporte(id){ const a=D.aportes.find(x=>x.id===id); await q(sb.from('aportes_reserva').delete().eq('id',id)); D.aportes=D.aportes.filter(x=>x.id!==id); closeSheet(); render();
  toast('Aporte excluído','Desfazer',async()=>{const {id:_,...c}=a;const d=normTx(await q(sb.from('aportes_reserva').insert(c).select().single()));D.aportes.push(d);render();}); }
function openAportes(id){ const r=D.reservas.find(x=>x.id===id), l=D.aportes.filter(a=>a.reserva_id===id).sort((a,b)=>b.data.localeCompare(a.data));
  sheet('Aportes · '+esc(r.nome),`${l.length} aporte${l.length===1?'':'s'} · ${brl(saldoRes(id))}`,`<div>${l.length?l.map(a=>`<div class="list-row" onclick="openAporte(${id},${a.id})"><span class="small">${fmtDY(a.data)}${a.obs?' · <span class="muted">'+esc(a.obs)+'</span>':''}</span><b class="small" style="color:var(--ok)">+ ${brl(a.valor)}</b></div>`).join(''):'<div class="empty">Nenhum aporte ainda.</div>'}</div><button class="btn btn-ok btn-block" onclick="openAporte(${id})">${ic('plus',16)} Novo aporte</button>`); }
