/* --- Histórico --- */
function openHist(){ if(S.hist.mes===null) S.hist.mes=S.mes; sheet('Histórico','Busca, filtros, edição e exportação',histBody()); }
function histFiltrados(){ const h=S.hist, qq=h.q.toLowerCase();
  return D.tx.filter(t=>(!h.mes||mesFiscal(t.data)===h.mes||mesOrc(t)===h.mes)&&(!h.tipo||t.tipo===h.tipo)&&(!h.cat||t.categoria===h.cat)&&(!h.forma||t.forma_pagamento===h.forma)&&(!qq||((t.obs||'')+' '+(t.categoria||'')).toLowerCase().includes(qq))).sort(ordemTx); }
function histBody(){ const h=S.hist, meses=[...new Set(D.tx.map(t=>mesFiscal(t.data)))].sort().reverse();
  return `<div style="position:relative"><span style="position:absolute;left:12px;top:13px;color:var(--faint)">${ic('search',18)}</span><input class="input" style="padding-left:40px" placeholder="Buscar por descrição ou categoria" value="${esc(h.q)}" oninput="S.hist.q=this.value;document.getElementById('hl').innerHTML=histList()"></div>
   <div class="two"><select class="input sel" onchange="S.hist.mes=this.value;sheetBody(histBody())"><option value="">Todos os meses</option>${meses.map(m=>`<option value="${m}" ${h.mes===m?'selected':''}>${nomeMes(m)} ${m.slice(0,4)}</option>`).join('')}</select>
    <select class="input sel" onchange="S.hist.tipo=this.value;sheetBody(histBody())"><option value="">Despesas e receitas</option><option ${h.tipo==='Despesa'?'selected':''}>Despesa</option><option ${h.tipo==='Receita'?'selected':''}>Receita</option></select></div>
   <div class="two"><select class="input sel" onchange="S.hist.cat=this.value;sheetBody(histBody())"><option value="">Todas as categorias</option>${catOptions(h.cat)}</select>
    <select class="input sel" onchange="S.hist.forma=this.value;sheetBody(histBody())"><option value="">Todas as formas</option>${FORMAS.map(f=>`<option ${h.forma===f?'selected':''}>${f}</option>`).join('')}</select></div>
   <div id="hl">${histList()}</div>`; }
function histList(){ const l=histFiltrados(), desp=l.filter(t=>t.tipo==='Despesa').reduce((a,t)=>a+t.valor,0), rec=l.filter(t=>t.tipo==='Receita').reduce((a,t)=>a+t.valor,0);
  return `<div class="between small" style="margin-bottom:6px"><span class="muted">${l.length} lançamento${l.length===1?'':'s'} · ${brl(desp)} em despesas${rec?' · '+brl(rec)+' em receitas':''}</span><button class="link" onclick="exportarCSV()">${ic('down',14)} CSV</button></div>
   ${l.length?l.slice(0,300).map(t=>txRow(t,true)).join('')+(l.length>300?'<div class="tiny muted" style="text-align:center;padding:8px">Mostrando 300. Use os filtros ou exporte o CSV.</div>':''):'<div class="empty">Nada encontrado.</div>'}`; }
function exportarCSV(){ const l=histFiltrados(), cel=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const linhas=[['Data','Mês','Tipo','Categoria','Balde','Descrição','Valor','Forma','Fixa','Fatura'].join(';')].concat(l.map(t=>[t.data,mesOrc(t),t.tipo,t.categoria||'',t.tipo==='Receita'?'':grupoDe(t.categoria),t.obs||'',String(t.valor).replace('.',','),t.forma_pagamento||'',t.despesa_fixa_id?'sim':'',ehCartaoVar(t)?faturaVenc(t.data):''].map(cel).join(';')));
  const blob=new Blob(['﻿'+linhas.join('\n')],{type:'text/csv;charset=utf-8'}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`lancamentos-${S.hist.mes||'todos'}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }

async function salvarDia(){ const d=Number(document.getElementById('cfg-dia').value); if(!(d>=1&&d<=28)) return toast('Use um dia entre 1 e 28');
  await q(sb.from('profiles').update({dia_inicio_mes:d}).eq('id',USER.id)); P.dia=d; S.mes=mesAtual(); render(); toast(d>1?`Seu mês agora vai do dia ${d} ao ${d-1}`:'Mês de calendário'); }
async function salvarCartao(){ const f=Number(document.getElementById('cfg-fecha').value)||null, v=Number(document.getElementById('cfg-vence').value)||null;
  if((f&&!v)||(v&&!f)||(f&&(f<1||f>28))||(v&&(v<1||v>28))) return toast('Preencha os dois dias (1 a 28) ou deixe os dois vazios');
  try{ await q(sb.from('profiles').update({cartao_dia_fechamento:f,cartao_dia_vencimento:v}).eq('id',USER.id)); P.fecha=f; P.vence=v; render(); toast(f?'Datas do cartão salvas':'Cartão conta pela data da compra'); }catch(e){} }
async function salvarLimite(id,val){ const v=parseV(val)||null; await q(sb.from('categorias').update({limite_mensal:v}).eq('id',id)); const c=D.cats.find(x=>x.id===id); c.limite_mensal=v||0; toast(v?'Limite salvo':'Limite removido'); }
function openCategoria(){ R={grupo:'Necessário'}; sheet('Nova categoria','Vale para toda a família',`<div class="field"><label>Nome</label><input class="input" id="cn" placeholder="Ex: Academia"></div>
  <div class="field"><label>Balde</label><div class="seg">${GRUPOS.map(g=>`<button class="${R.grupo===g?'on':''}" onclick="R.grupo='${g}';[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')">${g}</button>`).join('')}</div></div>
  <div class="field"><label>Limite mensal (opcional)</label><input class="input" id="cl" inputmode="numeric" placeholder="sem limite" oninput="maskV(this)"></div>
  <button class="btn btn-primary btn-block" onclick="saveCategoria()">${ic('tick')} Criar categoria</button>`); }
async function saveCategoria(){ const nome=document.getElementById('cn').value.trim(); if(!nome) return toast('Dê um nome'); if(D.cats.some(c=>c.nome.toLowerCase()===nome.toLowerCase()&&c.ativo!=='Não')) return toast('Já existe uma categoria com esse nome');
  const d=await q(sb.from('categorias').insert({nome,grupo:R.grupo,ativo:'Sim',limite_mensal:parseV(document.getElementById('cl').value)||null}).select().single()); D.cats.push({...d,limite_mensal:num(d.limite_mensal)}); closeSheet(); render(); toast('Categoria criada'); }
function askDelCat(id){ const c=D.cats.find(x=>x.id===id), uso=D.tx.filter(t=>t.categoria===c.nome).length;
  confirmar('Excluir categoria?',`<b>${esc(c.nome)}</b> ${uso?`tem <b>${uso} lançamento${uso>1?'s':''} seu${uso>1?'s':''}</b>, então não pode ser excluída. Mova os lançamentos para outra categoria antes.`:'não tem lançamentos seus. Se alguém da família usar, a exclusão é bloqueada.'}`,'Excluir',async()=>{ if(uso){ toast('Categoria em uso: não excluída'); return; } await q(sb.from('categorias').delete().eq('id',id)); D.cats=D.cats.filter(x=>x.id!==id); render(); toast('Categoria excluída'); }); }
function openRenda(id){ const r=id?D.rendas.find(x=>x.id===id):null; R={id:id||null};
  sheet(r?'Editar renda fixa':'Nova renda fixa','Conta sozinha todo mês dentro da vigência',`<div class="field"><label>Nome</label><input class="input" id="rnn" value="${esc(r?r.nome:'')}" placeholder="Ex: Salário"></div>
   <div class="field"><label>Valor</label><input class="input" id="rnv" inputmode="numeric" value="${r?fmtV(r.valor):''}" oninput="maskV(this)" placeholder="0,00"></div>
   <div class="two"><div class="field"><label>Começa em (opcional)</label><input class="input" id="rni" type="date" value="${r?.data_inicio||''}"></div><div class="field"><label>Termina em (opcional)</label><input class="input" id="rnf" type="date" value="${r?.data_fim||''}"></div></div>
   <p class="tiny muted">Se você também lança essa renda como receita todo mês, não cadastre aqui, senão conta em dobro.</p>
   <button class="btn btn-primary btn-block" onclick="saveRenda()">${ic('tick')} Salvar</button>
   ${r?`<button class="btn btn-soft btn-block" style="color:var(--bad)" onclick="askDelRenda()">${ic('trash',16)} Excluir</button>`:''}`); }
async function saveRenda(){ const g=x=>document.getElementById(x); const row={nome:g('rnn').value.trim(),valor:parseV(g('rnv').value),data_inicio:g('rni').value||null,data_fim:g('rnf').value||null}; if(!row.nome||!row.valor) return toast('Preencha nome e valor');
  if(R.id){ const d=await q(sb.from('rendas_fixas').update(row).eq('id',R.id).select().single()); D.rendas[D.rendas.findIndex(x=>x.id===R.id)]={...d,valor:num(d.valor)}; }
  else { const d=await q(sb.from('rendas_fixas').insert({...row,user_id:USER.id,ativo:'Sim'}).select().single()); D.rendas.push({...d,valor:num(d.valor)}); }
  closeSheet(); render(); toast('Renda fixa salva'); }
function askDelRenda(){ const id=R.id, r=D.rendas.find(x=>x.id===id); confirmar('Excluir renda fixa?',`<b>${esc(r.nome)}</b> deixa de contar em todos os meses. Se ela só acabou, preencha a data de término.`,'Excluir',async()=>{ await q(sb.from('rendas_fixas').delete().eq('id',id)); D.rendas=D.rendas.filter(x=>x.id!==id); render(); }); }

/* ============ ASSISTENTE ============ */
const SUGS=['Como está meu mês?','Onde posso cortar?','O que falta pagar?','Compare com o mês passado','Quanto devo investir?'];
try{ S.chat=JSON.parse(sessionStorage.getItem('chat')||'[]').filter(m=>m.role!=='typing'); }catch(e){}
const saveChat=()=>{ try{ sessionStorage.setItem('chat',JSON.stringify(S.chat.filter(m=>m.role!=='typing').slice(-40))); }catch(e){} };
function openChat(){ S.chatOpen=true; drawChatShell(); render(); setTimeout(()=>document.querySelector('.chat-in input')?.focus(),300); }
function closeChat(){ S.chatOpen=false; document.getElementById('chatLayer').innerHTML=''; render(); }
function novoChat(){ S.chat=[]; saveChat(); drawChatShell(); }
function drawChatShell(){ document.getElementById('chatLayer').innerHTML=`<div class="chat"><div class="chat-h"><div class="ai-av">${ic('spark',20)}</div><div style="flex:1"><b>Assistente financeiro</b><small><i class="dotc" style="background:var(--ok)"></i>Lê seus dados · só grava com sua confirmação</small></div>
  <button class="icon-btn" title="Nova conversa" onclick="novoChat()">${ic('refresh',16)}</button><button class="xbtn" onclick="closeChat()" aria-label="Fechar">${ic('x',16)}</button></div>
  <div class="chat-body" id="cb"></div><div class="sugs">${SUGS.map(s=>`<button class="sug" onclick="ask(this.textContent)">${s}</button>`).join('')}</div>
  <form class="chat-in" onsubmit="event.preventDefault();const i=this.q;if(i.value.trim()&&!S.busy){ask(i.value.trim());i.value=''}"><input name="q" placeholder="Pergunte sobre seu dinheiro…" autocomplete="off"><button aria-label="Enviar">${ic('send')}</button></form></div>`; drawChat(); }
function drawChat(){ const b=document.getElementById('cb'); if(!b) return;
  b.innerHTML = S.chat.length ? S.chat.map((m,i)=>{
    if(m.role==='user') return `<div class="msg me">${esc(m.content)}</div>`;
    if(m.role==='assistant') return `<div class="msg ai">${esc(m.content).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</div>`;
    if(m.role==='error') return `<div class="msg err">${esc(m.content)}</div>`;
    if(m.role==='typing') return `<div class="msg ai typing"><span></span><span></span><span></span></div>`;
    if(m.role==='proposal') return propCard(m,i); return '';
  }).join('') : `<div class="msg ai">Oi, ${esc((P.nome||'').split(' ')[0])}! Pergunte sobre o mês, onde cortar, o que falta pagar. Também posso lançar um gasto ou dar baixa numa fixa, sempre com sua confirmação.</div>`;
  b.scrollTop=b.scrollHeight; }
function propCard(m,i){ const p=m.p, title=p.tipo==='baixa'?`Dar baixa em ${esc(p.nome)}?`:`Lançar ${esc(p.descricao)}?`, sub=`${brl(p.valor)} · ${esc(p.categoria)} · ${fmtD(p.data)}`;
  if(m.done) return `<div class="action-card"><b>${title}</b><div class="small">${sub}</div><div class="small" style="margin-top:8px;font-weight:700;color:var(--ok)">${esc(m.done)}</div></div>`;
  return `<div class="action-card"><b>${title}</b><div class="small">${sub}</div><div class="chips" style="margin-top:8px">${FORMAS.map(f=>`<button class="chip ${p.forma_pagamento===f?'on':''}" onclick="S.chat[${i}].p.forma_pagamento='${f}';drawChat()">${f}</button>`).join('')}</div>
   <div class="between"><button class="btn btn-soft btn-sm" onclick="resolveProp(${i},false)">Cancelar</button><button class="btn btn-primary btn-sm" style="box-shadow:none" ${p.forma_pagamento?'':'disabled'} onclick="resolveProp(${i},true)">Confirmar</button></div></div>`; }
async function resolveProp(i,ok){ const m=S.chat[i], p=m.p;
  if(!ok){ m.done='Cancelado. Nada foi gravado.'; saveChat(); return drawChat(); }
  const row={user_id:USER.id,data:p.data,tipo:'Despesa',categoria:p.categoria,valor:p.valor,forma_pagamento:p.forma_pagamento,origem:'assistente',obs:p.tipo==='baixa'?'Baixa: '+p.nome:p.descricao,despesa_fixa_id:p.tipo==='baixa'?p.despesa_fixa_id:null};
  try{ let r=await sb.from('transacoes').insert(row).select().single(); if(r.error&&r.error.code==='23514'){ row.origem='painel'; r=await sb.from('transacoes').insert(row).select().single(); }
    if(r.error) throw r.error; D.tx.push(normTx(r.data)); m.done=p.tipo==='baixa'?'✓ Baixa registrada.':'✓ Lançado.'; render();
  }catch(e){ m.done='Erro ao gravar: '+traduzErro(e); }
  saveChat(); drawChat(); }
async function ask(qq){ if(S.busy) return; S.busy=true;
  S.chat.push({role:'user',content:qq}); S.chat.push({role:'typing'}); drawChat();
  const history=S.chat.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role,content:m.content}));
  try{ const {data,error}=await sb.functions.invoke('assistente',{body:{messages:history}});
    S.chat=S.chat.filter(m=>m.role!=='typing');
    if(error){ let msg='O assistente não respondeu. Tente de novo.'; try{ const j=await error.context.json(); if(j.erro) msg=j.erro; }catch(e){} S.chat.push({role:'error',content:msg}); }
    else { if(data.reply) S.chat.push({role:'assistant',content:data.reply}); (data.proposals||[]).forEach(p=>S.chat.push({role:'proposal',p})); }
  }catch(e){ S.chat=S.chat.filter(m=>m.role!=='typing'); S.chat.push({role:'error',content:'Sem conexão. Tente de novo.'}); }
  S.busy=false; saveChat(); drawChat(); }

/* ============ LOGIN E INÍCIO ============ */
function telaLogin(msg){ document.getElementById('root').innerHTML=`<div class="center"><div class="login"><div class="logo-mark" style="width:48px;height:48px;border-radius:16px;font-size:16px">50</div><h1>Painel 50/30/20</h1><p>Entre com seu e-mail e senha.</p>
  ${msg?`<div class="errbox">${esc(msg)}</div>`:''}<input class="input" id="em" type="email" placeholder="E-mail" autocomplete="username"><input class="input" id="pw" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
  <button class="btn btn-primary btn-block" id="bentrar" onclick="entrar()">Entrar</button><p class="tiny" style="text-align:center">Novas contas são criadas pelo administrador.</p></div></div>`; }
async function entrar(){ const b=document.getElementById('bentrar'); b.disabled=true; b.textContent='Entrando…';
  const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
  if(error) return telaLogin(/Invalid/i.test(error.message)?'E-mail ou senha incorretos.':traduzErro(error));
  USER=data.user; iniciar(); }
async function sair(){ await sb.auth.signOut(); USER=null; S.chat=[]; try{sessionStorage.removeItem('chat')}catch(e){} closeSheet(); document.getElementById('chatLayer').innerHTML=''; telaLogin(); }
async function iniciar(){
  document.getElementById('root').innerHTML='<div class="center"><div class="spin"></div></div>';
  try{ await carregar(); }catch(e){ return telaLogin('Não consegui carregar seus dados: '+traduzErro(e)); }
  render(); enviarFila();
  if(new URLSearchParams(location.search).has('lancar')){ history.replaceState(null,'',location.pathname); openLancar(); }
}
(async function boot(){
  if(!sb){ document.getElementById('root').innerHTML='<div class="center"><div class="login"><h1>Configuração ausente</h1><p>O arquivo config.js não foi encontrado ou está incompleto. Ele precisa estar na mesma pasta do index.html.</p></div></div>'; return; }
  const {data}=await sb.auth.getSession(); USER=data.session?.user||null;
  if(USER) iniciar(); else telaLogin();
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT' && USER){ USER=null; telaLogin(); } });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&USER) enviarFila(); });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(()=>{});
})();
</script>
